<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="フレーズ集">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>自己紹介攻略フレーズ30選</title>
<!-- 型：bonus/packs/app/index.html。パックごとに data.js と audio/ を差し替えて使う。ビルドは bonus/packs/tools/build.py -->
<style>
/* ---------- tokens ----------
   tint = 朱（しゅ）。赤ペンの丸＝「言えた」の色。1色だけ使う。 */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", "Yu Gothic UI", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", Roboto, sans-serif;
  --bg: #F2F2F7;
  --cell: #FFFFFF;
  --sheet: #FFFFFF;
  --label: #000000;
  --label2: rgba(60,60,67,.62);
  --label3: rgba(60,60,67,.32);
  --on-label: #FFFFFF;
  --sep: rgba(60,60,67,.24);
  --fill: rgba(118,118,128,.12);
  --fill2: rgba(120,120,128,.20);
  --press: rgba(0,0,0,.06);
  --thumb: #FFFFFF;
  --switch-off: rgba(120,120,128,.16);
  --tint: #CF3A20;
  --tint-fill: #CF3A20;
  --tint-soft: rgba(207,58,32,.09);
  --tint-track: rgba(207,58,32,.16);
  --bar: rgba(242,242,247,.88);
  --glass: rgba(252,252,253,.80);
  --glass-edge: rgba(0,0,0,.07);
  --float: 0 10px 30px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.06);
  --scrim: rgba(0,0,0,.32);
  --g: 16px;
  --r: 20px;
  --ease: cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #000000; --cell: #1C1C1E; --sheet: #1C1C1E;
    --label: #FFFFFF; --label2: rgba(235,235,245,.62); --label3: rgba(235,235,245,.32); --on-label: #000000;
    --sep: rgba(84,84,88,.65); --fill: rgba(118,118,128,.24); --fill2: rgba(120,120,128,.36);
    --press: rgba(255,255,255,.08); --thumb: #636366; --switch-off: rgba(120,120,128,.32);
    --tint: #FF6A4D; --tint-fill: #D84227; --tint-soft: rgba(255,106,77,.13); --tint-track: rgba(255,106,77,.22);
    --bar: rgba(14,14,16,.86); --glass: rgba(40,40,43,.78); --glass-edge: rgba(255,255,255,.09);
    --float: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.3); --scrim: rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg: #000000; --cell: #1C1C1E; --sheet: #1C1C1E;
  --label: #FFFFFF; --label2: rgba(235,235,245,.62); --label3: rgba(235,235,245,.32); --on-label: #000000;
  --sep: rgba(84,84,88,.65); --fill: rgba(118,118,128,.24); --fill2: rgba(120,120,128,.36);
  --press: rgba(255,255,255,.08); --thumb: #636366; --switch-off: rgba(120,120,128,.32);
  --tint: #FF6A4D; --tint-fill: #D84227; --tint-soft: rgba(255,106,77,.13); --tint-track: rgba(255,106,77,.22);
  --bar: rgba(14,14,16,.86); --glass: rgba(40,40,43,.78); --glass-edge: rgba(255,255,255,.09);
  --float: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.3); --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}
:root[data-theme="light"]{ color-scheme: light; }
@media (min-width: 600px){ :root{ --g: 20px; } }

/* ---------- base ---------- */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--bg); }
body{
  font-family:var(--font); font-size:17px; line-height:1.3;
  background:var(--bg); color:var(--label);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  min-height:100vh; min-height:100dvh;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
svg{ display:block; }
[hidden]{ display:none !important; }
.vh{ position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
:focus{ outline:none; }
:focus-visible{ outline:3px solid var(--tint); outline-offset:2px; }
html.locked, html.locked body{ overflow:hidden; }

.col{ max-width:640px; margin-inline:auto; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
.page{ overflow-x:clip; padding-bottom:calc(104px + env(safe-area-inset-bottom)); }
body.has-mini .page, body.has-hint .page{ padding-bottom:calc(176px + env(safe-area-inset-bottom)); }

/* ---------- nav bar (large title collapse) ---------- */
.nav{
  position:fixed; z-index:15; top:0; left:0; right:0;
  height:calc(44px + env(safe-area-inset-top)); padding-top:env(safe-area-inset-top);
  display:flex; align-items:center; justify-content:center;
  background:var(--bar);
  -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
  opacity:0; visibility:hidden; transition:opacity .18s linear, visibility 0s .18s;
}
.nav::after{ content:""; position:absolute; left:0; right:0; bottom:0; border-bottom:.5px solid var(--sep); transition:opacity .15s; }
body.collapsed .nav{ opacity:1; visibility:visible; transition:opacity .18s linear; }
body.stuck .nav::after{ opacity:0; }
.nav-title{
  max-width:min(72%, 520px); height:44px; padding:0 8px;
  font-size:17px; font-weight:600; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ---------- hero ---------- */
.hero{ padding:calc(env(safe-area-inset-top) + 14px) calc(var(--g) + 4px) 0; }
.hero-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.eyebrow{ font-size:13px; line-height:18px; font-weight:600; color:var(--label2); letter-spacing:.02em; }
.lt{
  margin-top:6px; font-size:24px; line-height:30px; font-weight:700; letter-spacing:.005em;
  font-feature-settings:"palt"; word-break:keep-all; overflow-wrap:anywhere; text-wrap:balance;
}
.prog{ display:flex; align-items:center; gap:7px; font-size:13px; line-height:20px; color:var(--label2); font-variant-numeric:tabular-nums; }
.prog .n{ color:var(--label); font-weight:600; }
.ring{ width:18px; height:18px; flex:none; transform:rotate(-90deg); }
.ring circle{ fill:none; stroke-width:2.6; }
.ring .tr{ stroke:var(--fill2); }
.ring .fg{ stroke:var(--tint); stroke-linecap:round; transition:stroke-dashoffset .5s var(--ease); }

/* ---------- palette (segmented, sticky) ---------- */
.palette{ position:sticky; z-index:14; top:calc(44px + env(safe-area-inset-top)); margin-top:10px; }
.palette::after{ content:""; position:absolute; left:0; right:0; bottom:0; border-bottom:.5px solid var(--sep); opacity:0; }
body.stuck .palette{ background:var(--bar); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); }
body.stuck .palette::after{ opacity:1; }
.palette .col > div{ padding:2px 0; }

.seg{
  --n:3; --i:0;
  position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  height:36px; padding:2px; border-radius:999px; background:var(--fill);
}
.seg .thumb{
  position:absolute; top:2px; bottom:2px; left:2px; width:calc((100% - 4px) / var(--n));
  border-radius:999px; background:var(--thumb);
  box-shadow:0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04), 0 0 0 .5px rgba(0,0,0,.04);
  transform:translateX(calc(100% * var(--i))); transition:transform .34s var(--ease);
}
.seg button{ position:relative; z-index:1; font-size:14px; font-weight:500; letter-spacing:-.005em; border-radius:999px; }
.seg button::after{ content:""; position:absolute; left:0; right:0; top:-5px; bottom:-5px; }
.seg button[aria-selected="true"], .seg button[aria-checked="true"]{ font-weight:600; }
.seg button:focus-visible{ outline-offset:-1px; }
.seg-sm{ height:32px; width:184px; flex:none; }
.seg-sm button{ font-size:13px; }
.seg-sm button::after{ top:-6px; bottom:-6px; }

/* ---------- chips ---------- */
.chips{ position:relative; display:flex; gap:8px; overflow-x:auto; padding:6px var(--g) 6px; scrollbar-width:none; overscroll-behavior-x:contain; }
.chips::-webkit-scrollbar{ display:none; }
.chip{
  position:relative; flex:none; height:34px; padding:0 15px; border-radius:17px;
  background:var(--fill); font-size:15px; font-weight:500; white-space:nowrap;
}
.chip::after{ content:""; position:absolute; left:-4px; right:-4px; top:-5px; bottom:-5px; }
.chip .c{ margin-left:5px; color:var(--label2); font-variant-numeric:tabular-nums; }
.chip[aria-pressed="true"]{ background:var(--label); color:var(--on-label); font-weight:600; }
.chip[aria-pressed="true"] .c{ color:inherit; opacity:.7; }

/* ---------- tools (count + hide toggles) ---------- */
.tools{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:14px calc(var(--g) + 4px) 0; }
.count{ font-size:13px; line-height:18px; color:var(--label2); font-variant-numeric:tabular-nums; }
.toggles{ display:flex; gap:8px; margin-left:auto; }
.tg{
  position:relative; height:32px; padding:0 13px; border-radius:16px;
  background:var(--fill); font-size:13px; font-weight:600; white-space:nowrap;
}
.tg::after{ content:""; position:absolute; left:-4px; right:-4px; top:-6px; bottom:-6px; }
.tg[aria-pressed="true"]{ background:var(--label); color:var(--on-label); }

/* ---------- inset grouped list ---------- */
.sec-h{
  margin:26px calc(var(--g) + 4px) 8px; font-size:20px; line-height:25px; font-weight:700;
  letter-spacing:.01em; font-feature-settings:"palt";
}
.tools + #list .sec:first-child .sec-h{ margin-top:18px; }
.group{ list-style:none; margin:0 var(--g); background:var(--cell); border-radius:var(--r); overflow:hidden; }
.group > li{ position:relative; }
.group > li + li::before{ content:""; position:absolute; z-index:1; top:0; right:0; left:var(--inset, 54px); border-top:.5px solid var(--sep); }
.row{
  position:relative; display:flex; align-items:center; gap:12px;
  width:100%; min-height:66px; padding:11px 14px 11px 12px; text-align:left;
  transition:background-color .2s;
}
.row:active{ background:var(--press); transition:none; }
@media (hover:hover){ .row:hover{ background:var(--press); } }
.row:focus-visible{ outline-offset:-3px; border-radius:var(--r); }
.lead{ flex:none; align-self:flex-start; width:30px; height:22px; display:flex; align-items:center; justify-content:center; }
.num{ font-size:15px; color:var(--label2); font-variant-numeric:tabular-nums; }
.lead .ck{ display:none; width:20px; height:20px; color:var(--tint); }
.bars{ display:none; align-items:flex-end; gap:2px; height:13px; }
.bars i{ display:block; width:3px; height:100%; border-radius:1.5px; background:var(--tint); transform-origin:50% 100%; }
.bars i:nth-child(1){ transform:scaleY(.45); }
.bars i:nth-child(2){ transform:scaleY(.95); }
.bars i:nth-child(3){ transform:scaleY(.65); }
.row.done .num{ display:none; }
.row.done .ck{ display:block; }
.row.playing .lead > *, .mode-listen .row.cur .lead > *{ display:none; }
.row.playing .bars, .mode-listen .row.cur .bars{ display:flex; }
.row.playing .bars i{ animation:eq .9s ease-in-out infinite; }
.row.playing .bars i:nth-child(2){ animation-delay:-.3s; }
.row.playing .bars i:nth-child(3){ animation-delay:-.6s; }
@keyframes eq{ 0%,100%{ transform:scaleY(.3); } 50%{ transform:scaleY(1); } }
.mode-listen .row.cur{ background:var(--tint-soft); }

.txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.en{ font-size:17px; line-height:22px; letter-spacing:-.012em; overflow-wrap:anywhere; }
.ja{ font-size:15px; line-height:20px; color:var(--label2); overflow-wrap:anywhere; }
.pt{ font-size:13px; line-height:18px; color:var(--tint); font-weight:500; }
.ppt{ margin-top:8px; font-size:15px; line-height:21px; color:var(--tint); font-weight:500; }
.t{ border-radius:5px; -webkit-box-decoration-break:clone; box-decoration-break:clone; transition:background-color .2s, color .2s; }
.hide-en .row:not(.cur) .en .t, .hide-en .row:not(.cur) .en .t *,
.hide-ja .row:not(.cur) .ja .t{ color:transparent; background:var(--fill2); }
.play{ flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--tint-soft); color:var(--tint); }
.play svg{ width:13px; height:13px; }
.play .ip{ margin-left:2px; }
.play .ia{ display:none; }
.mode-listen .row.cur.playing .play .ip{ display:none; }
.mode-listen .row.cur.playing .play .ia{ display:block; }

.foot{ margin:12px calc(var(--g) + 4px) 0; font-size:13px; line-height:18px; color:var(--label2); }

.empty{ margin:22px var(--g) 0; padding:36px 24px; background:var(--cell); border-radius:var(--r); text-align:center; }
.empty h2{ font-size:17px; line-height:22px; font-weight:600; }
.empty p{ margin-top:6px; font-size:15px; line-height:21px; color:var(--label2); word-break:keep-all; overflow-wrap:anywhere; }

/* ---------- listen settings ---------- */
.form{ margin-top:14px; }
.form > li{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; padding:8px 16px 8px 20px; }
.form{ --inset:20px; }
label.frow{ cursor:pointer; }
.flabel{ min-width:0; font-size:17px; line-height:22px; }
.flabel small{ display:block; margin-top:1px; font-size:13px; line-height:18px; color:var(--label2); }
.switch{ position:relative; flex:none; width:51px; height:31px; }
.switch input{ position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
.switch span{ position:absolute; inset:0; border-radius:16px; background:var(--switch-off); transition:background-color .25s; pointer-events:none; }
.switch span::after{
  content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%;
  background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06);
  transition:transform .3s var(--ease);
}
.switch input:checked + span{ background:var(--tint-fill); }
.switch input:checked + span::after{ transform:translateX(20px); }
.switch input:focus-visible + span{ outline:3px solid var(--tint); outline-offset:2px; }

.btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:50px; padding:0 22px; border-radius:25px; font-size:17px; font-weight:600; letter-spacing:-.01em;
  transition:opacity .15s, transform .15s;
}
.btn:active{ opacity:.72; }
.btn svg{ width:16px; height:16px; }
.btn-tint{ background:var(--tint-fill); color:#fff; }
.btn-gray{ background:var(--fill); color:var(--label); }
.btn-wide{ display:flex; width:calc(100% - 2 * var(--g)); margin:14px var(--g) 0; }

/* ---------- practice ---------- */
.pcard{ margin:16px var(--g) 0; padding:22px 22px 26px; background:var(--cell); border-radius:24px; }
.pmeta{ display:flex; justify-content:space-between; gap:12px; font-size:13px; line-height:18px; font-weight:600; color:var(--label2); font-variant-numeric:tabular-nums; }
.pmeta .wk{ color:var(--tint); margin-left:8px; }
.pja{ margin-top:22px; font-size:26px; line-height:36px; font-weight:700; font-feature-settings:"palt"; letter-spacing:.01em; }
.pen-wrap{ margin-top:22px; padding-top:20px; border-top:.5px solid var(--sep); }
.pen{ font-size:32px; line-height:36px; font-weight:600; letter-spacing:-.02em; text-wrap:balance; overflow-wrap:anywhere; }
.replay{ display:inline-flex; align-items:center; gap:6px; height:44px; margin:10px 0 -12px -2px; padding:0 2px; color:var(--tint); font-size:15px; font-weight:600; }
.replay svg{ width:20px; height:20px; }
.pactions{ display:flex; gap:10px; margin:16px var(--g) 0; }
.pactions .btn{ flex:1; }
.pdone{ margin:16px var(--g) 0; padding:34px 24px 28px; background:var(--cell); border-radius:24px; text-align:center; }
.pdone h2{ font-size:22px; line-height:28px; font-weight:700; }
.pdone p{ margin-top:8px; font-size:15px; color:var(--label2); font-variant-numeric:tabular-nums; }
.pdone .acts{ display:flex; flex-direction:column; gap:10px; margin-top:24px; }

/* ---------- tab bar (floating glass, Apple Music の下の帯) ---------- */
.tabbar{
  position:fixed; z-index:21; left:0; right:0; margin:0 auto;
  bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(calc(100% - 24px), 520px); height:64px; border-radius:32px; padding:5px;
  display:grid; grid-template-columns:repeat(3, 1fr); gap:2px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(190%); backdrop-filter:blur(24px) saturate(190%);
  box-shadow:var(--float), inset 0 0 0 .5px var(--glass-edge);
}
.tab{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border-radius:27px; color:var(--label); font-size:11px; line-height:13px; font-weight:600; letter-spacing:.01em;
  transition:background-color .25s var(--ease), color .2s;
}
.tab svg{ width:24px; height:24px; }
.tab[aria-selected="true"]{ color:var(--tint); background:var(--fill); }
.tab:active{ background:var(--fill2); }
.tab:focus-visible{ outline-offset:-3px; }

/* ---------- mini player (floating glass, タブの上に浮く) ---------- */
.mini{
  position:fixed; z-index:20; left:0; right:0; margin:0 auto;
  bottom:calc(82px + env(safe-area-inset-bottom));
  width:min(calc(100% - 24px), 520px); height:60px; border-radius:30px;
  display:flex; align-items:center; padding-right:8px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(190%); backdrop-filter:blur(24px) saturate(190%);
  box-shadow:var(--float), inset 0 0 0 .5px var(--glass-edge);
  transition:transform .45s var(--ease), opacity .3s;
}
.mini.off{ transform:translateY(24px); opacity:0; pointer-events:none; }
.mini-open{ flex:1; min-width:0; height:100%; padding:0 10px 0 22px; border-radius:30px 0 0 30px; text-align:left; display:flex; flex-direction:column; justify-content:center; gap:1px; }
.mini-open:focus-visible{ outline-offset:-3px; }
.mini-en{ font-size:15px; line-height:20px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em; }
.mini-ja{ font-size:13px; line-height:17px; color:var(--label2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ib{ position:relative; flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--label); }
.ib:active{ background:var(--press); }
.ib svg{ width:22px; height:22px; }
.ib .i-fwd{ width:26px; }

/* ---------- ホーム画面の案内（初回だけ。再生バーと同じ位置） ---------- */
.hint{
  position:fixed; z-index:19; left:0; right:0; margin:0 auto;
  bottom:calc(82px + env(safe-area-inset-bottom));
  width:min(calc(100% - 24px), 520px); min-height:60px; border-radius:22px;
  display:flex; align-items:center; gap:4px; padding:10px 6px 10px 18px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(190%); backdrop-filter:blur(24px) saturate(190%);
  box-shadow:var(--float), inset 0 0 0 .5px var(--glass-edge);
}
.hint-tx{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.hint-tx b{ font-size:14px; line-height:19px; font-weight:600; letter-spacing:-.005em; word-break:keep-all; overflow-wrap:anywhere; }
.hint-tx span{ word-break:keep-all; overflow-wrap:anywhere; }
.hint-tx span{ font-size:12px; line-height:17px; color:var(--label2); }
.hint .ib svg{ width:14px; height:14px; color:var(--label2); }

/* ---------- now playing sheet ---------- */
.scrim{ position:fixed; z-index:30; inset:0; background:var(--scrim); opacity:0; transition:opacity .4s; pointer-events:none; }
.scrim.open{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; z-index:31; left:0; right:0; bottom:0; margin:0 auto;
  top:calc(env(safe-area-inset-top) + 10px); width:min(100%, 640px);
  display:flex; flex-direction:column;
  background:var(--sheet); border-radius:28px 28px 0 0;
  padding:0 max(24px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  overflow-y:auto; overscroll-behavior:contain;
  transform:translateY(110vh); transition:transform .5s var(--ease);
  box-shadow:0 -1px 0 var(--glass-edge);
}
.sheet.open{ transform:none; }
.sheet.drag{ transition:none; }
@media (min-width:700px) and (min-height:700px){
  .sheet{ top:28px; bottom:28px; height:min(760px, calc(100% - 56px)); margin:auto; border-radius:28px; padding-bottom:24px; }
  .s-art{ max-height:300px; }
}
.grab{ flex:none; width:36px; height:5px; margin:7px auto 0; border-radius:3px; background:var(--label3); }
.s-top{ flex:none; display:grid; grid-template-columns:44px 1fr 44px; align-items:center; margin:4px -6px 0; }
.s-close{ width:44px; height:44px; display:grid; place-items:center; }
.s-close span{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--fill); color:var(--label2); }
.s-close svg{ width:16px; height:16px; }
.s-meta{ text-align:center; font-size:13px; line-height:18px; font-weight:600; color:var(--label2); font-variant-numeric:tabular-nums; }
/* 目玉：フレーズそのものをジャケットの位置に組む。枠いっぱいまで大きく、行送りは詰めて、下端をそろえる */
.s-main{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; min-height:0; }
.s-art{ position:relative; flex:1 1 0; min-height:190px; max-height:520px; margin-top:8px; }
.s-en{
  position:absolute; left:0; right:0; bottom:0;
  font-size:48px; line-height:1.04; font-weight:600; letter-spacing:-.022em;
  text-wrap:balance; overflow-wrap:normal; -webkit-hyphens:none; hyphens:none;
}
.s-en.brk{ overflow-wrap:anywhere; }
.s-ja{ flex:none; margin-top:18px; font-size:19px; line-height:26px; color:var(--label2); white-space:pre-line; }
.s-prog{ flex:none; margin-top:30px; }
.segs{ display:flex; gap:4px; height:6px; }
.segs i{ position:relative; display:block; flex:1 1 0; min-width:6px; height:6px; border-radius:3px; overflow:hidden; background:var(--fill2); }
.segs i u{ position:absolute; inset:0; background:var(--label); opacity:.85; transform-origin:0 50%; transform:scaleX(0); }
.segs i.g{ background:var(--tint-track); }
.segs i.g u{ background:var(--tint); opacity:1; }
.s-labels{ display:flex; justify-content:space-between; height:30px; padding-top:8px; font-size:12px; line-height:16px; font-weight:600; color:var(--label2); font-variant-numeric:tabular-nums; }
.s-labels .now-g{ color:var(--tint); }
.s-tr{ flex:none; display:flex; align-items:center; justify-content:center; gap:clamp(28px, 11vw, 56px); height:96px; margin-top:6px; }
.tb{ position:relative; display:grid; place-items:center; width:64px; height:64px; border-radius:50%; color:var(--label); transition:transform .15s, background-color .15s; }
.tb:active{ transform:scale(.9); background:var(--press); }
.tb:disabled{ opacity:.28; cursor:default; }
.tb:disabled:active{ transform:none; background:none; }
.tb svg{ width:36px; height:30px; }
.tb.big{ width:84px; height:84px; }
.tb.big svg{ width:46px; height:46px; }
.s-opts{ flex:none; display:flex; justify-content:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
.opt{ position:relative; height:36px; padding:0 14px; border-radius:18px; background:var(--fill); font-size:13px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
.opt::after{ content:""; position:absolute; left:-3px; right:-3px; top:-4px; bottom:-4px; }
.opt .k{ color:var(--label2); font-weight:500; margin-right:5px; }

/* ---------- motion ---------- */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ transition-duration:.01ms !important; animation:none !important; }
  .sheet{ transform:none; opacity:0; transition:opacity .01ms; }
  .sheet.open{ opacity:1; }
}
</style>

<script src="data.js"></script>
<script>
(function(){
'use strict';

/* ---------- data ---------- */
var PACK = window.PACK || {};
var items = Array.isArray(PACK.items) ? PACK.items : [];
if (PACK.kind === 'compare') items.forEach(function(it){
  if (it._ja === undefined) { it._ja = it.ja; it.ja = (it.kana || '') + (it.ja && it.ja !== it.kana ? '（' + it.ja + '）' : ''); }
});
var total = items.length;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sceneOf(it){ return it && it.scene ? String(it.scene) : ''; }
var scenes = [];
items.forEach(function(it){ var s = sceneOf(it); if (scenes.indexOf(s) < 0) scenes.push(s); });
var namedScenes = scenes.filter(Boolean);
function srcOf(it){ return it.src || ((PACK.audioBase || 'audio/') + it.id + '.mp3'); }
function durOf(it){ var d = Number(it.dur); return d > 0 ? d : 2; }
function gapSec(it){ return durOf(it) * 1.5 + 0.5; }

function enHTML(it){ return esc(it.en); }
/* 日本語の見出し：ひらがなの切れ目でだけ改行させる */
function jaBreak(s){ return esc(s).replace(/([ぁ-ゖ])(?=[^ぁ-ゖー、。！？」』）\s])/g, '$1<wbr>').replace(/([、。])/g, '$1<wbr>'); }

/* ---------- storage ---------- */
var KEY = 'phrasepack:' + (PACK.id || 'default');
var S = { gap: true, repeat: 1, rate: 1, hide: '' };
var done = new Set(), weak = new Set();
try {
  var raw = localStorage.getItem(KEY);
  var o = raw ? JSON.parse(raw) : null;
  if (o && typeof o === 'object') {
    if (Array.isArray(o.done)) done = new Set(o.done.map(String));
    if (Array.isArray(o.weak)) weak = new Set(o.weak.map(String));
    if (typeof o.gap === 'boolean') S.gap = o.gap;
    if ([1,2,3].indexOf(o.repeat) >= 0) S.repeat = o.repeat;
    if (o.rate === 0.8 || o.rate === 1) S.rate = o.rate;
    if (o.hide === 'en' || o.hide === 'ja') S.hide = o.hide;
  }
} catch (e) {}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({ done: Array.from(done), weak: Array.from(weak), gap: S.gap, repeat: S.repeat, rate: S.rate, hide: S.hide })); } catch (e) {}
}

/* ---------- icons (SF Symbols 風) ---------- */
var IC = {
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 4.6v14.8L19.4 12z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.2" y="3.8" width="4.8" height="16.4" rx="1.4" fill="currentColor"/><rect x="14" y="3.8" width="4.8" height="16.4" rx="1.4" fill="currentColor"/></svg>',
  fwd: '<svg class="i-fwd" viewBox="0 0 26 24" aria-hidden="true"><path d="M2.6 5.4v13.2L12.8 12v6.6L23.4 12 12.8 5.4V12z" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>',
  back: '<svg class="i-fwd" viewBox="0 0 26 24" aria-hidden="true"><path d="M23.4 5.4v13.2L13.2 12v6.6L2.6 12l10.6-6.6V12z" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>',
  down: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check: '<svg class="ck" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9.2" fill="currentColor"/><path d="M6 10.4l2.7 2.7L14.2 7.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.2L11.5 5v14l-4.8-4.2H3.5a1 1 0 0 1-1-1V10.2a1 1 0 0 1 1-1z" fill="currentColor"/><path d="M15 8.6a4.6 4.6 0 0 1 0 6.8M17.9 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>'
};
var rowPlay = '<svg class="ip" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 4.6v14.8L19.4 12z" fill="currentColor" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg>'
            + '<svg class="ia" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.2" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1.2" fill="currentColor"/></svg>';

/* ---------- elements ---------- */
var body = document.body, root = document.documentElement;
var listEl = $('list'), chipsEl = $('chips'), sheet = $('sheet'), scrim = $('scrim'), mini = $('mini');
var reduceMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

/* ---------- ui state ---------- */
var mode = 'list';
var filter = 'all';
var sheetOpen = false;

function visible(){
  var out = [];
  scenes.forEach(function(sc){
    items.forEach(function(it, i){
      if (sceneOf(it) !== sc) return;
      if (filter === 'weak' && !weak.has(String(it.id))) return;
      if (filter !== 'all' && filter !== 'weak' && sc !== filter) return;
      out.push(i);
    });
  });
  return out;
}

/* ---------- header ---------- */
document.title = PACK.title || document.title;
$('label').textContent = PACK.label || '';
$('label').hidden = !PACK.label;
$('title').innerHTML = jaBreak(PACK.title || '');
$('navTitle').textContent = PACK.title || '';
try { document.querySelector('meta[name="apple-mobile-web-app-title"]').content = PACK.short || PACK.title || 'フレーズ集'; } catch (e) {}

function updateProgress(){
  var n = items.filter(function(it){ return done.has(String(it.id)); }).length;
  $('progText').innerHTML = '言えた <span class="n">' + n + '</span> / ' + total;
  var C = 50.27, p = total ? n / total : 0;
  $('ringFg').setAttribute('stroke-dashoffset', (C * (1 - p)).toFixed(2));
}

/* ---------- chips ---------- */
function renderChips(){
  var weakN = items.filter(function(it){ return weak.has(String(it.id)); }).length;
  var list = [{ v: 'all', t: 'すべて' }].concat(namedScenes.map(function(s){ return { v: s, t: s }; }), [{ v: 'weak', t: 'まだ言えない', c: weakN }]);
  chipsEl.innerHTML = list.map(function(c){
    return '<button type="button" class="chip" data-f="' + esc(c.v) + '" aria-pressed="' + (filter === c.v) + '">' + esc(c.t)
      + (c.c ? '<span class="c">' + c.c + '</span>' : '') + '</button>';
  }).join('');
}
function revealChip(){
  var b = chipsEl.querySelector('.chip[aria-pressed="true"]'); if (!b) return;
  var l = b.offsetLeft - 16, r = b.offsetLeft + b.offsetWidth + 16 - chipsEl.clientWidth;
  if (chipsEl.scrollLeft > l) chipsEl.scrollLeft = l;
  else if (chipsEl.scrollLeft < r) chipsEl.scrollLeft = r;
}
chipsEl.addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  setFilter(b.getAttribute('data-f'));
});
function setFilter(f){
  filter = f;
  renderChips();
  revealChip();
  if (mode === 'practice') enterPractice();
  else renderList();
  updateListenBtn();
}

/* ---------- list ---------- */
function rowHTML(i){
  var it = items[i], id = String(it.id);
  return '<li><button type="button" class="row' + (done.has(id) ? ' done' : '') + '" data-i="' + i + '">'
    + '<span class="lead" aria-hidden="true"><span class="num">' + (i + 1) + '</span>' + IC.check + '<span class="bars"><i></i><i></i><i></i></span></span>'
    + '<span class="txt"><span class="en" lang="en"><span class="t">' + enHTML(it) + '</span></span><span class="ja"><span class="t">' + esc(it.ja) + '</span></span>'
    + (it.point ? '<span class="pt">' + esc(it.point) + '</span>' : '') + '</span>'
    + '<span class="play" aria-hidden="true">' + rowPlay + '</span>'
    + (done.has(id) ? '<span class="vh">（言えた）</span>' : '')
    + '</button></li>';
}
function emptyHTML(){
  if (filter === 'weak') return '<div class="empty"><h2>まだ言えないフレーズはありません</h2><p>' + jaBreak('練習で「まだ言えない」を押したフレーズが、ここに入ります。') + '</p></div>';
  return '<div class="empty"><h2>フレーズがありません</h2></div>';
}
function renderList(){
  var order = visible();
  $('count').textContent = order.length ? order.length + '本' : '';
  if (!order.length) { listEl.innerHTML = emptyHTML(); markRows(); return; }
  var html = '', cur = null, many = namedScenes.length > 0;
  order.forEach(function(i){
    var sc = sceneOf(items[i]);
    if (sc !== cur) {
      if (cur !== null) html += '</ul></section>';
      html += '<section class="sec">' + (many && sc ? '<h2 class="sec-h">' + esc(sc) + '</h2>' : '') + '<ul class="group">';
      cur = sc;
    }
    html += rowHTML(i);
  });
  html += '</ul></section>';
  var planned = Number(PACK.total_planned);
  if (filter === 'all' && planned > total) html += '<p class="foot">サンプル ' + total + '本（完成版は' + planned + '本）</p>';
  listEl.innerHTML = html;
  markRows();
}
listEl.addEventListener('click', function(e){
  var b = e.target.closest('.row'); if (!b) return;
  var i = +b.getAttribute('data-i');
  var order = visible(), pos = order.indexOf(i);
  if (pos < 0) return;
  if (mode === 'listen') {
    if (P.active && P.cont && P.order[P.pos] === i && sameOrder(order)) { togglePlay(); return; }
    startAt(order, pos, true);
  } else {
    startAt(order, pos, false);
  }
});

function applyHide(){
  body.classList.toggle('hide-en', S.hide === 'en');
  body.classList.toggle('hide-ja', S.hide === 'ja');
  $('hideEn').setAttribute('aria-pressed', S.hide === 'en');
  $('hideJa').setAttribute('aria-pressed', S.hide === 'ja');
}
$('hideEn').addEventListener('click', function(){ S.hide = S.hide === 'en' ? '' : 'en'; applyHide(); save(); });
$('hideJa').addEventListener('click', function(){ S.hide = S.hide === 'ja' ? '' : 'ja'; applyHide(); save(); });

/* ---------- modes (segmented) ---------- */
var modeTabs = Array.prototype.slice.call(document.querySelectorAll('#modes [role="tab"]'));
var MODES = ['list', 'listen', 'practice'];
modeTabs.forEach(function(t){
  t.addEventListener('click', function(){ setMode(t.getAttribute('data-mode')); });
  t.addEventListener('keydown', function(e){
    var k = MODES.indexOf(mode), n = k;

var silCache = {};

  var ds = Math.max(1, Math.round(sec * 10));
  if (silCache[ds] !== undefined) return silCache[ds];
  var url = '';
  try {
    var rate = 8000, n = Math.round(rate * ds / 10), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    var w = function(o, s){ for (var k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); };

}
